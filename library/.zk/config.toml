# Notebook zk per la wiki. Chiavi verificate sul sorgente di zk-org/zk.
# Dopo `zk init`, `zk list` non deve mostrare raw/.

[note]
language = "it"
default-title = "Senza titolo"
# Fonti: <sha>-<slug>, sha = primi 8 hex dello SHA-256 del PDF in raw/pdf/,
# passato con `zk new sources --extra sha=<sha>`.
filename = "{{extra.sha}}-{{slug title}}"
extension = "md"
template = "source.md"
# raw.local-*: la vecchia raw locale, conservata da `wizki raw` dopo lo spostamento in rete
exclude = ["raw/**", "raw.local-*/**", "log.md", "index.md"]

[group.sources]
paths = ["sources"]

[group.topics]
paths = ["topics"]

[group.topics.note]
# L'hub si chiama come il topic, senza data: [[scuola]] -> topics/scuola.md
filename = "{{slug title}}"
template = "topic.md"

[group.entities]
paths = ["entities"]

[group.entities.note]
# Una pagina per entità (persona, ente, luogo, norma, opera, evento), senza data:
# `zk new entities --title "<Nome>" --extra tipo=<tipo>` -> entities/<slug>.md
filename = "{{slug title}}"
template = "entity.md"

[group.analyses]
paths = ["analyses"]

[group.analyses.note]
# Analisi salvate dalle query: <data>-<slug>, così si ordinano per data.
# `zk new analyses --title "<titolo>"` -> analyses/2026-11-08-<slug>.md
filename = "{{format-date now '%Y-%m-%d'}}-{{slug title}}"
template = "analysis.md"

[format.markdown]
link-format = "wiki"
hashtags = true

[alias]
topics   = "zk tag list $argv"
orphans  = "zk list --orphan $argv"
untagged = "zk list --tagless $argv"
by       = "zk list --tag $argv"
hist     = "zk list --format path --delimiter0 --quiet $argv | xargs -t -0 git log --patch --"
